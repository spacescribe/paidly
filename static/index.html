<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paidly</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" />
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1b1f27;
    --text-muted: #6b7280;
    --accent: #0a5fc2;
    --accent-soft: #e8f1fd;
    --danger: #b3261e;
    --danger-soft: #fdeceb;
    --warn: #8a5a00;
    --ok: #166534;
    --ok-soft: #eafaf0;
    --radius: 8px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  header h1 { font-size: 16px; font-weight: 600; margin: 0; }

  #status-bar { font-size: 13px; color: var(--text-muted); display: flex; gap: 16px; }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }

  .status-dot.mock { background: var(--warn); }
  .status-dot.live { background: var(--ok); }

  main {
    display: grid;
    grid-template-columns: 1fr 1.3fr 0.9fr;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 57px);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  #invoice-grid { flex: 1; width: 100%; }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg { max-width: 90%; padding: 8px 12px; border-radius: var(--radius); font-size: 13px; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.assistant { align-self: flex-start; background: var(--accent-soft); color: var(--text); }

  #chat-input-row { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
  #chat-input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; }

  button { cursor: pointer; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; }
  #chat-input-row button { padding: 8px 16px; background: var(--accent); color: #fff; }

  #quick-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
  .chip { padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); color: var(--text-muted); font-size: 12px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .tabs-header { display: flex; padding: 0; border-bottom: 1px solid var(--border); }
  .tab-btn {
    flex: 1;
    padding: 10px 6px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-badge {
    display: inline-block;
    min-width: 16px;
    padding: 0 4px;
    margin-left: 4px;
    border-radius: 999px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    line-height: 16px;
  }

  .tab-content { display: none; flex: 1; min-height: 0; overflow-y: auto; flex-direction: column; gap: 8px; padding: 10px 14px; }
  .tab-content.active { display: flex; }

  #approvals-list, #trace-list { display: flex; flex-direction: column; gap: 8px; }

  .approval-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; font-size: 13px; }
  .approval-card .tool-name { font-weight: 600; margin-bottom: 4px; }
  .approval-card pre {
    background: var(--bg);
    padding: 6px 8px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11px;
    overflow-x: auto;
    margin: 6px 0;
  }

  .approval-actions { display: flex; gap: 6px; margin-top: 6px; }
  .approval-actions button { padding: 5px 12px; }
  .btn-approve { background: var(--ok-soft); color: var(--ok); }
  .btn-reject { background: var(--danger-soft); color: var(--danger); }

  .trace-entry {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
  }
  .trace-entry .tool-name { color: var(--accent); font-weight: 600; }

  .empty-state { color: var(--text-muted); font-size: 12px; padding: 10px 14px; }

  .kya-revoke-row { display: flex; justify-content: flex-end; }
  .kya-revoke-row button { padding: 4px 12px; font-size: 11px; }

  .kya-summary { font-size: 12px; line-height: 1.6; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.active { background: var(--ok-soft); color: var(--ok); }
  .badge.revoked { background: var(--danger-soft); color: var(--danger); }

  .kya-scopes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .kya-scope-tag { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }

  .audit-entry { font-family: var(--mono); font-size: 10.5px; padding: 6px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); }
  .decision { font-weight: 600; }
  .decision.allowed, .decision.approved { color: var(--ok); }
  .decision.queued { color: var(--accent); }
  .decision.denied, .decision.rejected { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>Paidly</h1>
  <div id="status-bar">Loading status...</div>
</header>

<main>
  <section class="panel" id="grid-panel">
    <div class="panel-header">Invoices</div>
    <div id="invoice-grid" class="ag-theme-quartz"></div>
  </section>

  <section class="panel" id="chat-panel">
    <div class="panel-header">Chat</div>
    <div id="quick-actions">
      <button class="chip" data-prompt="Chase everything overdue.">Chase overdue</button>
      <button class="chip" data-prompt="List all open disputes.">List disputes</button>
      <button class="chip" data-prompt="Draft dispute evidence for DIS-5001.">Draft dispute evidence</button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Ask the copilot..." />
      <button id="chat-send">Send</button>
    </div>
  </section>

  <section class="panel" id="side-panel">
    <div class="tabs-header">
      <button class="tab-btn active" data-tab="approvals">Approvals<span id="approvals-badge" class="tab-badge" style="display:none;"></span></button>
      <button class="tab-btn" data-tab="trace">Trace</button>
      <button class="tab-btn" data-tab="kya">KYA</button>
    </div>

    <div class="tab-content active" data-tab-content="approvals">
      <div id="approvals-list"><div class="empty-state">No pending actions.</div></div>
    </div>

    <div class="tab-content" data-tab-content="trace">
      <div id="trace-list"><div class="empty-state">No tool calls yet.</div></div>
    </div>

    <div class="tab-content" data-tab-content="kya">
      <div class="kya-revoke-row">
        <button id="kya-revoke-btn" class="btn-reject">Revoke Passport</button>
      </div>
      <div id="kya-passport-summary" class="empty-state">Loading passport...</div>
      <div id="kya-audit-list"></div>
    </div>
  </section>
</main>

<script>
const chatMessagesEl = document.getElementById('chat-messages');
const approvalsListEl = document.getElementById('approvals-list');
const traceListEl = document.getElementById('trace-list');
const statusBarEl = document.getElementById('status-bar');
const chatInputEl = document.getElementById('chat-input');

let gridApi;

const columnDefs = [
  { field: 'id', headerName: 'Invoice' },
  { field: 'recipient_name', headerName: 'Recipient' },
  { field: 'amount', headerName: 'Amount', valueFormatter: p => `${p.data.currency} ${p.value.toFixed(2)}` },
  { field: 'due_date', headerName: 'Due Date' },
  { field: 'status', headerName: 'Status' },
  { field: 'reminders_sent', headerName: 'Reminders' },
];

function initGrid() {
  const gridDiv = document.getElementById('invoice-grid');
  gridApi = agGrid.createGrid(gridDiv, {
    columnDefs,
    rowData: [],
    defaultColDef: { resizable: true, sortable: true },
  });
}

async function refreshStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();
  statusBarEl.innerHTML = `
    <span><span class="status-dot ${data.mock_mode ? 'mock' : 'live'}"></span>${data.mock_mode ? 'Mock mode' : 'Live PayPal'}</span>
  `;
}

async function refreshInvoices() {
  const res = await fetch('/api/invoices');
  const data = await res.json();
  gridApi.setGridOption('rowData', data);
}

async function refreshPending() {
  const res = await fetch('/api/pending');
  const data = await res.json();
  renderApprovals(data);
}

const kyaPassportEl = document.getElementById('kya-passport-summary');
const kyaAuditEl = document.getElementById('kya-audit-list');

function renderPassport(record) {
  if (!record) {
    kyaPassportEl.innerHTML = '<div class="empty-state">No passport issued.</div>';
    return;
  }
  const p = record.payload;
  const expires = new Date(p.exp * 1000).toLocaleString();
  kyaPassportEl.innerHTML = `
    <div><span class="badge ${record.revoked ? 'revoked' : 'active'}">${record.revoked ? 'REVOKED' : 'ACTIVE'}</span> ${p.agent_name}</div>
    <div>Owner: ${p.owner}</div>
    <div>Expires: ${expires}</div>
    <div>Limits: ${p.limits.max_reminders_per_day}/day reminders, max ${p.limits.max_invoice_amount} ${p.limits.allowed_currencies.join('/')}</div>
    <div class="kya-scopes">${p.scopes.map(s => `<span class="kya-scope-tag">${s}</span>`).join('')}</div>
  `;
}

function renderAudit(entries) {
  if (!entries.length) {
    kyaAuditEl.innerHTML = '<div class="empty-state">No audit entries yet.</div>';
    return;
  }
  kyaAuditEl.innerHTML = entries.map(e => {
    const time = new Date(e.timestamp * 1000).toLocaleTimeString();
    return `<div class="audit-entry">${time} <span class="decision ${e.decision}">${e.decision}</span> ${e.tool} — ${e.reason}</div>`;
  }).join('');
}

async function refreshKya() {
  const [passportRes, auditRes] = await Promise.all([
    fetch('/api/kya/passport'),
    fetch('/api/kya/audit'),
  ]);
  renderPassport(await passportRes.json());
  renderAudit(await auditRes.json());
}

document.getElementById('kya-revoke-btn').addEventListener('click', async () => {
  if (!confirm("Revoke this agent's passport? All further actions will be denied.")) return;
  await fetch('/api/kya/revoke', { method: 'POST' });
  await refreshKya();
});

const approvalsBadgeEl = document.getElementById('approvals-badge');

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.querySelector(`.tab-content[data-tab-content="${btn.dataset.tab}"]`).classList.add('active');
  });
});

function renderApprovals(items) {
  if (!items.length) {
    approvalsBadgeEl.style.display = 'none';
    approvalsListEl.innerHTML = '<div class="empty-state">No pending actions.</div>';
    return;
  }
  approvalsBadgeEl.textContent = items.length;
  approvalsBadgeEl.style.display = 'inline-block';
  approvalsListEl.innerHTML = items.map(item => `
    <div class="approval-card" data-id="${item.id}">
      <div class="tool-name">${item.tool_name}</div>
      <pre>${JSON.stringify(item.tool_input, null, 2)}</pre>
      <div class="approval-actions">
        <button class="btn-approve" data-action="approve" data-id="${item.id}">Approve</button>
        <button class="btn-reject" data-action="reject" data-id="${item.id}">Reject</button>
      </div>
    </div>
  `).join('');
}

approvalsListEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const { action, id } = btn.dataset;
  await fetch(`/api/${action}/${id}`, { method: 'POST' });
  await refreshPending();
  await refreshInvoices();
  await refreshKya();
});

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chatMessagesEl.appendChild(div);
  chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
}

function renderTrace(entries) {
  if (traceListEl.querySelector('.empty-state')) traceListEl.innerHTML = '';
  entries.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'trace-entry';
    div.innerHTML = `<span class="tool-name">${entry.tool}</span>(${JSON.stringify(entry.input)}) → ${JSON.stringify(entry.result)}`;
    traceListEl.appendChild(div);
  });
}

async function sendChat(text) {
  if (!text.trim()) return;
  appendMessage('user', text);
  chatInputEl.value = '';

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text }),
  });
  const data = await res.json();
  appendMessage('assistant', data.reply);
  renderTrace(data.tool_trace);
  await refreshKya();

  if (data.new_approvals.length) {
    await refreshPending();
  }
}

document.getElementById('chat-send').addEventListener('click', () => sendChat(chatInputEl.value));
chatInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat(chatInputEl.value);
});

document.getElementById('quick-actions').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  sendChat(chip.dataset.prompt);
});

async function init() {
  initGrid();
  await refreshStatus();
  await refreshInvoices();
  await refreshPending();
  await refreshKya();
}

init();
</script>
</body>
</html>
