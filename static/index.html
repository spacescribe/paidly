<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dunning Copilot</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" />
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1b1f27;
    --text-muted: #6b7280;
    --accent: #0a5fc2;
    --accent-soft: #e8f1fd;
    --danger: #b3261e;
    --danger-soft: #fdeceb;
    --warn: #8a5a00;
    --ok: #166534;
    --ok-soft: #eafaf0;
    --radius: 8px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  header h1 { font-size: 16px; font-weight: 600; margin: 0; }

  #status-bar { font-size: 13px; color: var(--text-muted); display: flex; gap: 16px; }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }

  .status-dot.mock { background: var(--warn); }
  .status-dot.live { background: var(--ok); }

  main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 57px);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  #invoice-grid { flex: 1; width: 100%; }

  .sidebar { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; }

  #chat-panel { flex: 1.2; min-height: 0; }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg { max-width: 90%; padding: 8px 12px; border-radius: var(--radius); font-size: 13px; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.assistant { align-self: flex-start; background: var(--accent-soft); color: var(--text); }

  #chat-input-row { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
  #chat-input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; }

  button { cursor: pointer; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; }
  #chat-input-row button { padding: 8px 16px; background: var(--accent); color: #fff; }

  #quick-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
  .chip { padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); color: var(--text-muted); font-size: 12px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  #approvals-panel, #trace-panel { flex: 1; min-height: 0; }
  #approvals-list, #trace-list { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }

  .approval-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; font-size: 13px; }
  .approval-card .tool-name { font-weight: 600; margin-bottom: 4px; }
  .approval-card pre {
    background: var(--bg);
    padding: 6px 8px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11px;
    overflow-x: auto;
    margin: 6px 0;
  }

  .approval-actions { display: flex; gap: 6px; margin-top: 6px; }
  .approval-actions button { padding: 5px 12px; }
  .btn-approve { background: var(--ok-soft); color: var(--ok); }
  .btn-reject { background: var(--danger-soft); color: var(--danger); }

  .trace-entry {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
  }
  .trace-entry .tool-name { color: var(--accent); font-weight: 600; }

  .empty-state { color: var(--text-muted); font-size: 12px; padding: 10px 14px; }
</style>
</head>
<body>
<header>
  <h1>Dunning Copilot</h1>
  <div id="status-bar">Loading status...</div>
</header>

<main>
  <section class="panel" id="grid-panel">
    <div class="panel-header">Invoices</div>
    <div id="invoice-grid" class="ag-theme-quartz"></div>
  </section>

  <section class="sidebar">
    <section class="panel" id="chat-panel">
      <div class="panel-header">Chat</div>
      <div id="quick-actions">
        <button class="chip" data-prompt="Chase everything overdue.">Chase overdue</button>
        <button class="chip" data-prompt="List all open disputes.">List disputes</button>
        <button class="chip" data-prompt="Draft dispute evidence for DIS-5001.">Draft dispute evidence</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="Ask the copilot..." />
        <button id="chat-send">Send</button>
      </div>
    </section>

    <section class="panel" id="approvals-panel">
      <div class="panel-header">Pending Approvals</div>
      <div id="approvals-list"><div class="empty-state">No pending actions.</div></div>
    </section>

    <section class="panel" id="trace-panel">
      <div class="panel-header">Tool Trace</div>
      <div id="trace-list"><div class="empty-state">No tool calls yet.</div></div>
    </section>
  </section>
</main>

<script>
const chatMessagesEl = document.getElementById('chat-messages');
const approvalsListEl = document.getElementById('approvals-list');
const traceListEl = document.getElementById('trace-list');
const statusBarEl = document.getElementById('status-bar');
const chatInputEl = document.getElementById('chat-input');

let gridApi;

const columnDefs = [
  { field: 'id', headerName: 'Invoice' },
  { field: 'recipient_name', headerName: 'Recipient' },
  { field: 'amount', headerName: 'Amount', valueFormatter: p => `${p.data.currency} ${p.value.toFixed(2)}` },
  { field: 'due_date', headerName: 'Due Date' },
  { field: 'status', headerName: 'Status' },
  { field: 'reminders_sent', headerName: 'Reminders' },
];

function initGrid() {
  const gridDiv = document.getElementById('invoice-grid');
  gridApi = agGrid.createGrid(gridDiv, {
    columnDefs,
    rowData: [],
    defaultColDef: { resizable: true, sortable: true },
  });
}

async function refreshStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();
  statusBarEl.innerHTML = `
    <span><span class="status-dot ${data.mock_mode ? 'mock' : 'live'}"></span>${data.mock_mode ? 'Mock mode' : 'Live PayPal'}</span>
  `;
}

async function refreshInvoices() {
  const res = await fetch('/api/invoices');
  const data = await res.json();
  gridApi.setGridOption('rowData', data);
}

async function refreshPending() {
  const res = await fetch('/api/pending');
  const data = await res.json();
  renderApprovals(data);
}

function renderApprovals(items) {
  if (!items.length) {
    approvalsListEl.innerHTML = '<div class="empty-state">No pending actions.</div>';
    return;
  }
  approvalsListEl.innerHTML = items.map(item => `
    <div class="approval-card" data-id="${item.id}">
      <div class="tool-name">${item.tool_name}</div>
      <pre>${JSON.stringify(item.tool_input, null, 2)}</pre>
      <div class="approval-actions">
        <button class="btn-approve" data-action="approve" data-id="${item.id}">Approve</button>
        <button class="btn-reject" data-action="reject" data-id="${item.id}">Reject</button>
      </div>
    </div>
  `).join('');
}

approvalsListEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const { action, id } = btn.dataset;
  await fetch(`/api/${action}/${id}`, { method: 'POST' });
  await refreshPending();
  await refreshInvoices();
});

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chatMessagesEl.appendChild(div);
  chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
}

function renderTrace(entries) {
  if (traceListEl.querySelector('.empty-state')) traceListEl.innerHTML = '';
  entries.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'trace-entry';
    div.innerHTML = `<span class="tool-name">${entry.tool}</span>(${JSON.stringify(entry.input)}) → ${JSON.stringify(entry.result)}`;
    traceListEl.appendChild(div);
  });
}

async function sendChat(text) {
  if (!text.trim()) return;
  appendMessage('user', text);
  chatInputEl.value = '';

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text }),
  });
  const data = await res.json();
  appendMessage('assistant', data.reply);
  renderTrace(data.tool_trace);

  if (data.new_approvals.length) {
    await refreshPending();
  }
}

document.getElementById('chat-send').addEventListener('click', () => sendChat(chatInputEl.value));
chatInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat(chatInputEl.value);
});

document.getElementById('quick-actions').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  sendChat(chip.dataset.prompt);
});

async function init() {
  initGrid();
  await refreshStatus();
  await refreshInvoices();
  await refreshPending();
}

init();
</script>
</body>
</html>
